<!doctype html>
<html lang="fr">
<title>GymMane Séances</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,600&display=swap">
<style>
/* Layout : appli mobile, une colonne de 560px max, barre d'onglets fixée en bas, lecteur et fiches en plein écran.
   Couleurs reprises de lib/theme/app_colors.dart (GymMane, sombre d'abord). */
:root{
  --page:#0A0908; --bg:#0A0A0A; --raised:#1C1C1C; --raised2:#2B2B2B; --border:#3E3E3E;
  --nav:rgba(10,10,10,.88);
  --text:#FFFFFF; --text2:#9A9A9A; --text3:#666666;
  --ember:#FFFFFF; --on-ember:#0A0A0A; --ember-soft:rgba(255,255,255,.10);
  --accent:#D9A184; --accent-soft:rgba(217,161,132,.16);
  --brass:#B98F72; --sage:#8FA377; --sage-soft:rgba(143,163,119,.16);
  --info:#7FA8C9; --warn:#E0B15A; --danger:#E5674C; --muted:#2A2A2A;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:10px; --r-m:16px; --r-l:24px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --page:#FFFEFD; --bg:#F7F4F0; --raised:#FFFFFF; --raised2:#ECE8E3; --border:#E0DBD5;
  --nav:rgba(255,254,253,.92);
  --text:#1A1713; --text2:#5F574F; --text3:#8A8179;
  --ember:#1A1713; --on-ember:#FFFFFF; --ember-soft:rgba(26,23,19,.07);
  --accent:#9E4E27; --accent-soft:rgba(158,78,39,.12);
  --brass:#8A6B41; --sage:#3D7A52; --sage-soft:rgba(61,122,82,.12);
  --info:#3268A0; --warn:#9A6A12; --danger:#C0392B; --muted:#E9E4DE;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --page:#FFFEFD; --bg:#F7F4F0; --raised:#FFFFFF; --raised2:#ECE8E3; --border:#E0DBD5;
  --nav:rgba(255,254,253,.92);
  --text:#1A1713; --text2:#5F574F; --text3:#8A8179;
  --ember:#1A1713; --on-ember:#FFFFFF; --ember-soft:rgba(26,23,19,.07);
  --accent:#9E4E27; --accent-soft:rgba(158,78,39,.12);
  --brass:#8A6B41; --sage:#3D7A52; --sage-soft:rgba(61,122,82,.12);
  --info:#3268A0; --warn:#9A6A12; --danger:#C0392B; --muted:#E9E4DE;
  color-scheme:light;
}
:root{
  --body-main:var(--raised2);
  --body-lite:color-mix(in srgb, var(--raised2), var(--text3) 14%);
  --muscle:color-mix(in srgb, var(--raised2), var(--text2) 32%);
  --muscle-2:color-mix(in srgb, var(--accent) 42%, var(--muscle));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:12px;flex:none;overflow:hidden;background:var(--ember);color:var(--on-ember);display:grid;place-items:center}
.top h1{font-size:22px;font-weight:900;letter-spacing:-.01em}
.top .sub{color:var(--text2);font-size:13px;font-weight:600}
.grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--raised);display:grid;place-items:center;flex:none}

.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.section:first-child{margin-top:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-head h2{font-size:18px;font-weight:900}
.link{background:none;border:0;color:var(--accent);font-weight:800;font-size:13px;padding:4px}
.hint{font-size:12.5px;color:var(--text2)}
.card{background:var(--raised);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:12px}

/* Résumé */
.today{background:var(--raised);border-radius:var(--r-l);padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today .k{font-size:26px;font-weight:900;line-height:1}
.today .l{font-size:12px;color:var(--text2);font-weight:700;margin-top:4px}
.week{grid-column:1/-1;display:flex;gap:6px;margin-top:10px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--text3)}
.week .dot{width:100%;height:8px;border-radius:4px;background:var(--muted)}
.week .on .dot{background:var(--accent)}
.week .now{color:var(--text)}

/* Types */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type{position:relative;text-align:left;border:1px solid var(--border);background:var(--raised);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px;transition:transform .15s ease,border-color .15s}
.type:hover{border-color:var(--text3)}
.type:active{transform:scale(.98)}
.type[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--raised)}
.type .ic,.tint-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint);flex:none}
.type .nm{font-weight:900;font-size:16px}
.type .ds{font-size:12.5px;color:var(--text2);font-weight:600;line-height:1.35}
.type .ct{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;color:var(--text3)}

/* Puces */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--text2);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--on-ember)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--ember-soft);color:var(--text2)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

/* Séances */
.group-h{font-size:13px;font-weight:900;color:var(--text2);margin-top:6px}
.sessions{display:flex;flex-direction:column;gap:10px}
.sess{background:var(--raised);border-radius:var(--r-m);overflow:hidden}
.sess-h{display:flex;gap:12px;align-items:center;padding:14px;width:100%;background:none;border:0;text-align:left}
.sess-h .t{font-weight:900;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--text2);font-weight:700;margin-top:3px}
.lvl{display:inline-flex;align-items:center;gap:4px}
.bars{display:inline-flex;gap:2px;align-items:flex-end}
.bars i{width:3px;border-radius:1px;background:var(--muted)}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:12px}
.bars i.on{background:var(--accent)}
.chev{transition:transform .2s;color:var(--text3);flex:none}
.sess.open .chev{transform:rotate(90deg)}
.sess-b{border-top:1px solid var(--border);padding:6px 14px 14px;display:none}
.sess.open .sess-b{display:block}
.focus{font-size:13px;color:var(--text2);padding:8px 0 4px}
.exlist{list-style:none;margin:0;padding:0}
.exlist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border)}
.exlist li:last-child{border-bottom:0}
.exlist .n{flex:1;min-width:0;font-weight:700}
.exlist .n small{display:block;color:var(--text3);font-weight:600;font-size:12px;margin-top:1px}
.exlist .p{font-weight:800;color:var(--accent);white-space:nowrap;font-size:13.5px;text-align:right}
.exlist .p small{display:block;color:var(--text3);font-weight:700}
.exlist button.n{background:none;border:0;padding:0;text-align:left}

/* Dessins d'exercices */
.art{position:relative;background:var(--raised2);border-radius:12px;overflow:hidden;color:var(--text);flex:none;display:grid;place-items:center}
.art svg{width:100%;height:100%;display:block}
.art .ph{width:34%;height:34%;color:var(--text3);display:grid;place-items:center}
.art.sm{width:48px;height:48px;border-radius:10px}
.art.md{width:64px;height:64px}
.art.lg{width:100%;height:220px;border-radius:var(--r-m)}
.art.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--ember-soft) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:15px;background:var(--ember);color:var(--on-ember);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:var(--ember-soft);color:var(--text)}
.btn.accent{background:var(--accent);color:#1A1210}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}

/* Carte du corps */
.bodymap{background:var(--raised);border-radius:var(--r-l);padding:14px 10px 10px}
.bodymap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.bodymap .m{fill:var(--muscle);transition:fill .15s}
.bodymap .m.on{fill:var(--ember)}
.bodymap .m.sec{fill:var(--muscle-2)}
.bodymap .m.pri{fill:var(--accent)}
.bodymap .hit{fill:transparent;cursor:pointer}
.bodymap .views{display:flex;justify-content:space-around;font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.mini .bodymap{padding:8px 4px 4px;background:var(--bg)}

/* Bibliothèque */
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--raised);border-radius:14px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-weight:700;font-size:16px;outline:none}
.search svg{color:var(--text3);flex:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.select{width:100%;min-width:0;border:1px solid var(--border);background:var(--raised);border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px}
.lib{display:flex;flex-direction:column}
.libitem{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border)}
.libitem .open{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;min-width:0;flex:1}
.libitem .t{font-weight:800;display:block}
.libitem .s{font-size:12.5px;color:var(--text2);font-weight:600}
.libitem .add{width:36px;height:36px;border-radius:11px;background:var(--ember-soft);display:grid;place-items:center;flex:none;border:0}
.libitem .add[aria-pressed="true"]{background:var(--accent);color:#1A1210}

/* Ma séance */
.basket{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.basket-in{max-width:528px;margin:0 auto;background:var(--ember);color:var(--on-ember);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.basket-in b{font-weight:900}
.basket-in .btn{background:var(--on-ember);color:var(--ember)}

/* Outils */
.tools{display:flex;flex-direction:column;gap:12px}
.big{font-size:52px;font-weight:900;letter-spacing:-.02em;line-height:1;text-align:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:800;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:800;font-size:16px}
.result{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.result .main{font-size:22px;font-weight:900}
.result table{width:100%;border-collapse:collapse;font-size:13px}
.result td{padding:4px 0;border-bottom:1px dashed var(--border)}
.result td:last-child{text-align:right;font-weight:800}
.plates{display:flex;align-items:center;gap:3px;min-height:70px;padding:6px 0;overflow-x:auto}
.bar{height:10px;width:46px;background:var(--text3);border-radius:2px;flex:none}
.plate{border-radius:4px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;writing-mode:vertical-rl}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.lap{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border);color:var(--text2)}
.lap b{color:var(--text)}
details.tool{padding:0;gap:0}
details.tool>summary{list-style:none;padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px}
details.tool>summary::-webkit-details-marker{display:none}
details.tool>summary>svg:first-child{color:var(--accent);flex:none}
details.tool>summary .d{font-size:12.5px;color:var(--text2);font-weight:600}
details.tool>summary .chev{margin-left:auto}
details.tool[open]>summary .chev{transform:rotate(90deg)}
details.tool>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:800;font-size:13px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--raised2);color:var(--text)}
.section > .seg{background:var(--raised)}
.section > .seg button[aria-pressed="true"]{background:var(--ember);color:var(--on-ember)}

/* Aliments */
.foods{display:flex;flex-direction:column}
.food{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.food .ph{width:52px;height:52px;border-radius:12px;background:var(--raised2);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--text3)}
.food .ph img{width:100%;height:100%;object-fit:contain}
.food .t{font-weight:800}
.macros{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--text2);font-weight:700}
.macros b{color:var(--text)}
.kcal{font-weight:900;text-align:right;white-space:nowrap}
.kcal small{display:block;font-size:11px;color:var(--text3);font-weight:700}

/* Profil */
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{background:var(--raised);border-radius:var(--r-m);padding:14px;display:flex;gap:12px;align-items:center}
.hitem .t{font-weight:900}
.empty{background:var(--raised);border-radius:var(--r-m);padding:22px;text-align:center;color:var(--text2);display:flex;flex-direction:column;gap:10px;align-items:center}
.sample{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;background:var(--raised);border-radius:var(--r-m);padding:14px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--muted);max-width:100%}
.heat i.l1{background:var(--accent-soft)}.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,transparent)}.heat i.l3{background:var(--accent)}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:none;border:0;padding:0;min-width:0}
.medal .img{width:100%;aspect-ratio:1;max-width:84px;display:grid;place-items:center}
.medal img{width:100%;height:100%;object-fit:contain}
.medal .nm{font-size:11.5px;font-weight:800;line-height:1.2}
.medal .pg{width:70%;height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.medal .pg i{display:block;height:100%;background:var(--accent)}
.medal.off .nm{color:var(--text3)}
.feat ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.feat li{display:flex;gap:10px;font-size:14px;color:var(--text2)}
.feat li b{color:var(--text)}
.feat li::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--accent);margin-top:8px}
.pill{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sage-soft);color:var(--sage);vertical-align:2px}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:800;color:var(--text3);border-radius:12px;min-width:0}
.nav button[aria-current="page"]{color:var(--text)}
.nav button[aria-current="page"] .nic{background:var(--ember-soft)}
.nic{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}

/* Fiche et lecteur plein écran */
.overlay{position:fixed;inset:0;z-index:50;background:var(--page);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-y:auto;overscroll-behavior:contain}
.sheet{z-index:40}
.ov-in{flex:1;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px}
.ph-row{display:flex;align-items:center;gap:10px}
.ph-row .t{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-row .s{font-size:12.5px;color:var(--text2);font-weight:700}
.prog{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.phase{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:var(--ember-soft);color:var(--text2)}
.phase.work{background:var(--accent-soft);color:var(--accent)}
.phase.rest{background:var(--sage-soft);color:var(--sage)}
.exname{font-size:clamp(24px,6.5vw,34px);font-weight:900;letter-spacing:-.01em}
.setinfo{font-size:15px;font-weight:800;color:var(--text2)}
.stage .art.lg{height:clamp(150px,26vh,230px);max-width:340px}
.ring{position:relative;width:min(50vw,200px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--muted)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .25s linear}
.ring.rest .val{stroke:var(--sage)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px}
.ring .c b{font-size:clamp(40px,11vw,56px);font-weight:900;line-height:1}
.ring .c span{font-size:13px;color:var(--text2);font-weight:700}
.target{font-size:clamp(52px,16vw,80px);font-weight:900;line-height:1}
.target small{display:block;font-size:15px;color:var(--text2);font-weight:800;margin-top:6px}
.cue{max-width:44ch;color:var(--text2);font-size:14px}
.steps{text-align:left;max-width:48ch;margin:0;padding-left:20px;color:var(--text2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.log{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.log .field{width:120px}
.log .field input{text-align:center}
.nextup{display:flex;align-items:center;gap:12px;background:var(--raised);border-radius:var(--r-m);padding:10px;text-align:left;width:100%;max-width:360px}
.nextup .s{font-size:11px;color:var(--text3);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.nextup .t{font-weight:900}
.pctl{display:flex;gap:8px;position:sticky;bottom:0;padding-top:6px;background:var(--page)}
.pctl .btn{flex:1;padding:16px}
.pctl .btn.sq{flex:none;width:56px;padding:0}
.done .medal-ic{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats3 div{background:var(--raised);border-radius:14px;padding:12px}
.stats3 b{display:block;font-size:22px;font-weight:900}
.stats3 span{font-size:12px;color:var(--text2);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--text2);font-weight:700}
.kv dd{margin:0;font-weight:800}
.chain{display:flex;flex-direction:column;gap:6px}
.chain button{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px 10px 6px 6px;text-align:left;font-weight:800}
.chain button[aria-current="true"]{border-color:var(--accent)}
.card h3{font-size:15px;font-weight:900}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ember);color:var(--on-ember);font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.types{grid-template-columns:1fr}.medals{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- Libellés français (repris de lib/l10n/app_fr.arb) ---------- */
const MUSCLE = { chest:'Pectoraux', back:'Dos', lowerback:'Lombaires', shoulders:'Épaules', biceps:'Biceps', triceps:'Triceps', forearm:'Avant-bras', trapezius:'Trapèzes', abdomen:'Abdominaux', obliques:'Obliques', quads:'Quadriceps', hamstrings:'Ischio-jambiers', glutes:'Fessiers', calves:'Mollets' };
const MUSCLES = ['chest','back','trapezius','lowerback','shoulders','biceps','triceps','forearm','abdomen','obliques','quads','glutes','hamstrings','calves'];
const EQUIP = { Barbell:'Barre', Dumbbell:'Haltère', Cable:'Poulie', Machine:'Machine', Bodyweight:'Poids du corps', Weighted:'Lesté', Band:'Élastique', Kettlebell:'Kettlebell', Rings:'Anneaux', Other:'Autre' };
const DIFF = { Beginner:'Débutant', Intermediate:'Intermédiaire', Advanced:'Avancé' };
const LVL = ['','Débutant','Intermédiaire','Avancé'];
const WD = ['','Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

/* ---------- Catalogue ---------- */
const EX = Object.fromEntries(D.exercises.map(e => [e.id, e]));
const MODES = D.meta.modes;
const isCardio = id => MODES[id] === 'cardio';
const isTimed = id => MODES[id] === 'time';
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
D.exercises.forEach(e => { e.key = norm([e.fr, e.en, ...e.al, MUSCLE[e.p]||'', EQUIP[e.eq]||''].join(' ')); });
const CHAINS = D.meta.progressions;

/* Exercice de séance tiré du catalogue (séries, reps ou durée par défaut). */
function fromCatalog(id, sets, reps, extra = {}){
  const e = EX[id];
  if (isCardio(id)) return { id, n:e.fr, t:1200, ...extra };
  if (isTimed(id)) return { id, n:e.fr, s:sets, t:45, rest:45, ...extra };
  const bw = e.eq === 'Bodyweight' || e.eq === 'Band';
  return { id, n:e.fr, s:sets, r:reps || '8-12', rest:bw ? 60 : 90, kg:!bw, ...extra };
}
function estimate(ex){ return Math.max(5, Math.round(ex.reduce((a,e) => { const s = e.s || 1; return a + s*(e.t || 40) + (s-1)*(e.rest||0) + (e.rest||30); }, 0) / 60 / 5) * 5); }

  'A · Chest & Triceps':'A · Pectoraux et triceps', 'B · Back & Biceps':'B · Dos et biceps', 'C · Legs':'C · Jambes', 'D · Shoulders & Abs':'D · Épaules et abdos',
  'A · Chest':'A · Pectoraux', 'B · Back':'B · Dos', 'D · Shoulders':'D · Épaules', 'E · Arms':'E · Bras', 'Workout A':'Séance A', 'Workout B':'Séance B', 'Recommended Routine':'Routine', 'Home A':'Maison A', 'Home B':'Maison B' };
const PROG_INFO = {
  fullbody:[1,'Tout le corps trois fois par semaine. La base pour débuter.'], ppl:[2,'Poussée, tirage, jambes : chaque groupe une fois par semaine.'],
  arnold:[3,'Six jours par semaine, le split d\'Arnold Schwarzenegger.'], upperlower:[2,'Haut et bas du corps en alternance.'],
  abcd:[2,'Un ou deux groupes musculaires par jour.'], abcde:[3,'Un groupe musculaire par jour.'],
  stronglifts:[1,'5 séries de 5 sur les grands mouvements. Ajoute un peu de charge à chaque séance.'], startingstrength:[1,'3 séries de 5, progression linéaire simple.'],
  rr:[1,'La routine au poids du corps de r/bodyweightfitness.'], home:[1,'Deux séances sans matériel, à la maison.'] };
function programSessions(){
  const out = [];
  D.programs.forEach(p => {
    const [lvl, focus] = PROG_INFO[p.id] || [2, ''];
    const fivers = p.id === 'stronglifts' || p.id === 'startingstrength';
    const pname = PROG_FR[p.name] || p.name;
    const days = p.days.map(d => d.wd).filter(Boolean).map(w => WD[w].toLowerCase()).join(', ');
    p.days.forEach((d, i) => {
      const ex = d.ex.map(([id, s]) => fromCatalog(id, s, fivers ? '5' : '8-12', fivers && !isTimed(id) ? { rest:180 } : {}));
      out.push({ id:`p-${p.id}-${i}`, group:pname, groupInfo:`${focus} ${p.days.length} jours par semaine : ${days}.`, prog:true,
        name:`${DAY_FR[d.name] || d.name}${d.wd ? ' · ' + WD[d.wd] : ''}`, lvl, focus:`${pname}, jour ${i+1} sur ${p.days.length}. ${focus}`, ex });
    });
  });
  return out;
}

/* ---------- Dessins animés des exercices (rendu repris de lib/widgets/exercise_art.dart) ---------- */
const liveArts = new Set();
const NS = 'http://www.w3.org/2000/svg';
function artHTML(e, size = 'sm', live = false){
  if (!e || !e.art) return `<span class="art ${size}" aria-hidden="true"><span class="ph">${svg(e && isCardio(e.id) ? 'cardio' : 'barbell', 24, 1.8)}</span></span>`;
  return `<span class="art ${size} loading" data-art="${e.art}" ${live?'data-live="1"':''} role="img" aria-label="${esc(e.fr)}"></span>`;
}
const artIO = 'IntersectionObserver' in window ? new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting){ artIO.unobserve(en.target); drawArt(en.target); } }), { rootMargin:'300px' }) : null;
function hydrate(root){ root.querySelectorAll('.art[data-art]:not([data-done])').forEach(el => { el.dataset.done = '1'; artIO ? artIO.observe(el) : drawArt(el); }); }
async function drawArt(el){
  try {
    const frames = await artFrames(el.dataset.art);
    const live = !!el.dataset.live && frames.length > 1;
    const s = document.createElementNS(NS, 'svg'), g = document.createElementNS(NS, 'g');
    const paths = (live ? frames : frames.slice(0, 1)).map((d, i) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'currentColor'); p.setAttribute('fill-rule', 'evenodd'); if (i) p.style.opacity = 0; g.appendChild(p); return p; });
    s.appendChild(g); s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    el.textContent = ''; el.appendChild(s);
    const b = g.getBBox(), pad = Math.max(b.width, b.height) * .08;
    s.setAttribute('viewBox', `${b.x-pad} ${b.y-pad} ${b.width+pad*2} ${b.height+pad*2}`);
    el.classList.remove('loading');
    if (live && !reduced()){ liveArts.add({ el, paths, t0:performance.now() }); if (liveArts.size === 1) requestAnimationFrame(animateArts); }
  } catch { el.classList.remove('loading'); el.innerHTML = `<span class="ph">${svg('barbell',24,1.8)}</span>`; }
}
function animateArts(now){
  for (const a of liveArts){
    if (!a.el.isConnected){ liveArts.delete(a); continue; }
    const n = a.paths.length, steps = (n-1)*2, pos = ((now - a.t0) / 1560 % 1) * steps;
    const step = Math.floor(pos) % steps, f = pos - Math.floor(pos);
    const asc = step < n-1, from = asc ? step : steps - step, to = asc ? from+1 : from-1;
    let bl = f < .72 ? 0 : (f - .72) / .28; bl = bl < .5 ? 2*bl*bl : 1 - Math.pow(-2*bl+2, 2)/2;
    a.paths.forEach((p, i) => p.style.opacity = i === from ? 1 - bl : i === to ? bl : 0);
  }
  if (liveArts.size) requestAnimationFrame(animateArts);
}

let clipN = 0;
function bodyHTML(opts = {}){
  const B = D.body[sex] || D.body.m, cls = opts.cls || (() => ''), cut = B.headCut, id = 'bc' + (++clipN);
  let s = `<svg viewBox="0 0 535 462" role="${opts.interactive?'group':'img'}" aria-label="${opts.label||'Carte des muscles'}">`;
  if (cut) s += `<defs><clipPath id="${id}b"><rect x="-535" y="${cut}" width="1605" height="924"/></clipPath><clipPath id="${id}m"><rect x="-535" y="${cut}" width="1605" height="924"/>${B.headInner.map(d=>`<path d="${d}"/>`).join('')}</clipPath></defs><g clip-path="url(#${id}b)">`;
  s += B.base.map(d => `<path d="${d}" fill="var(--body-main)"/>`).join('') + B.lite.map(d => `<path d="${d}" fill="var(--body-lite)"/>`).join('');
  if (cut) s += `</g>` + B.head.map(d => `<path d="${d}" fill="var(--body-lite)"/>`).join('') + `<g clip-path="url(#${id}m)">`;
  for (const [m, ds] of Object.entries(B.fills)) s += ds.map(d => `<path class="m ${cls(m)}" d="${d}"/>`).join('');
  if (cut) s += `</g>`;
  if (opts.interactive) for (const m of Object.keys(B.fills).reverse()) {
    const ds = (B.hits[m] && B.hits[m].length) ? B.hits[m] : B.fills[m];
    s += ds.map(d => `<path class="hit" data-m="${m}" d="${d}"><title>${MUSCLE[m]}</title></path>`).join('');
  }
  return `<div class="bodymap">${s}</svg><div class="views"><span>Face</span><span>Dos</span></div></div>`;
}

/* ---------- Son ---------- */
let actx = null;
function beep(freq = 880, dur = .12, vol = .25){
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur + .02);
  } catch {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
function renderSound(){ $('#soundBtn').innerHTML = svg(sound ? 'vol' : 'mute'); $('#soundBtn').setAttribute('aria-pressed', String(sound)); }

/* ---------- Statistiques ---------- */
function stats(list = history){
  const set = new Set(list.map(h => dayKey(h.date)));
  let streak = 0; const d = new Date(); d.setHours(0,0,0,0);
  if (!set.has(dayKey(d))) d.setDate(d.getDate()-1);
  while (set.has(dayKey(d))) { streak++; d.setDate(d.getDate()-1); }
  const best = {}; let records = 0;
  [...list].reverse().forEach(h => (h.ex||[]).forEach(x => { if (!x.kg) return; if (best[x.id] != null && x.kg > best[x.id]) records++; if (best[x.id] == null || x.kg > best[x.id]) best[x.id] = x.kg; }));
  return { set, streak, sessions:list.length, sets:list.reduce((a,h)=>a+(h.sets||0),0), vol:list.reduce((a,h)=>a+(h.vol||0),0),
    hours:list.reduce((a,h)=>a+h.dur,0)/3600, prog:list.filter(h=>h.prog).length, records, best };
}

/* ---------- Vue Carte du corps (lib/state/workout_state.dart : _defaultPicks) ---------- */
function pickFor(muscles, n = 6){
  const pool = D.exercises.filter(e => !e.kind && !isCardio(e.id) && (muscles.includes(e.p) || e.s.some(m => muscles.includes(m))));
  const done = new Set(history.flatMap(h => (h.ex||[]).map(x => x.id)));
  const rank = e => (done.has(e.id) ? 0 : 1) + (e.art ? 0 : 2);
  const picks = [];
  for (const m of muscles){ const c = pool.filter(e => e.p === m && !picks.includes(e)).sort((a,b) => rank(a)-rank(b)); if (c.length) picks.push(c[0]); }
  for (const e of pool.filter(e => !picks.includes(e)).sort((a,b) => rank(a)-rank(b))){ if (picks.length >= n) break; picks.push(e); }
  return { picks, pool };
}

/* ---------- Lecteur de séance ---------- */
let P = null, wakeLock = null;
async function lockScreen(){ try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
function sessionSteps(sess){
  const steps = [];
  sess.ex.forEach((e, ei) => { const sets = e.s || 1;
    for (let i = 1; i <= sets; i++){
      steps.push({ kind:'work', ex:e, ei, set:i, sets });
      if (e.rest && !(ei === sess.ex.length - 1 && i === sets)) steps.push({ kind:'rest', ex:e, ei, set:i, sets, t:e.rest, label:e.restLabel || 'Repos' });
    } });
  return steps;
}
function startSession(sess, type){
  if (!sess || !sess.ex.length) return;
  if (!$('#sheet').hidden){ $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }
  P = { type, sess, steps:sessionSteps(sess), i:0, started:Date.now(), paused:false, end:0, left:0, log:{}, raf:0, showSteps:false };
  beep(660,.05,.01); lockScreen();
  $('#player').hidden = false; document.body.style.overflow = 'hidden'; renderBasket();
  enterStep();
}
const cur = () => P.steps[P.i];
const timedStep = st => st.kind === 'rest' || !!st.ex.t;
function enterStep(){
  const st = cur(); if (!st) return finish();
  P.paused = false; P.lastBeep = null; P.showSteps = false;
  if (timedStep(st)){ P.left = st.kind === 'rest' ? st.t : st.ex.t; P.total = P.left; P.end = Date.now() + P.left*1000; }
  if (st.kind === 'work'){ beep(st.ex.t ? 990 : 740, .18); buzz(80); }
  renderPlayer(); tick();
}
function tick(){
  cancelAnimationFrame(P.raf);
  if (!timedStep(cur())) return;
  const loop = () => { if (!P) return;
    if (!P.paused){ P.left = (P.end - Date.now())/1000; const w = Math.ceil(P.left);
      if (w <= 3 && w > 0 && P.lastBeep !== w){ P.lastBeep = w; beep(520,.1); }
      if (P.left <= 0){ beep(1040,.35); buzz([120,60,120]); return next(); }
      updateRing(); }
    P.raf = requestAnimationFrame(loop); };
  P.raf = requestAnimationFrame(loop);
}
const RC = 2*Math.PI*54;
function updateRing(){ const v = $('#ringVal'), t = $('#ringTxt'); if (!v) return; v.style.strokeDashoffset = String(RC * (1 - Math.max(0,P.left)/P.total)); t.textContent = fmt(Math.ceil(P.left)); }
function saveLog(){ const st = cur(); if (!st || st.kind !== 'work') return; const kg = $('#inKg'), rp = $('#inReps'); if (kg || rp) P.log[P.i] = { id:st.ex.id, kg:kg ? parseFloat(kg.value) || 0 : 0, reps:rp ? parseInt(rp.value) || 0 : 0 }; }
function next(){ saveLog(); P.i++; enterStep(); }
function prev(){ saveLog(); if (P.i > 0) P.i--; enterStep(); }

function confirmQuit(){
  saveLog(); P.paused = true;

  $('#qResume').onclick = () => { P.paused = false; if (timedStep(cur())) P.end = Date.now() + P.left*1000; renderPlayer(); tick(); };
  $('#qSave').onclick = () => finish(true);

function finish(partial){
  cancelAnimationFrame(P.raf);
  const before = stats();
  const dur = Math.round((Date.now() - P.started)/1000);
  const sets = P.steps.slice(0, partial ? P.i : P.steps.length).filter(s => s.kind === 'work').length;
  const ex = Object.values(P.log).filter(l => l.id && (l.kg || l.reps));
  const vol = ex.reduce((a,l) => a + (l.kg||0)*(l.reps||0), 0);
  const recs = [...new Set(ex.filter(l => l.kg && before.best[l.id] != null && l.kg > before.best[l.id]).map(l => EX[l.id] ? EX[l.id].fr : ''))];
  history.unshift({ id:Date.now(), date:Date.now(), type:P.type.id, sess:P.sess.name, dur, sets, vol:Math.round(vol), partial:!!partial, prog:!!P.sess.prog, ex });
  history = history.slice(0, 500); store.set('history', history);
  const after = stats();
  const newMedals = D.awards.filter(a => awardValue(a.id, before) < awardGoal(a.id) && awardValue(a.id, after) >= awardGoal(a.id));
  beep(784,.15); setTimeout(() => beep(1046,.3), 160); buzz([100,50,100,50,200]);
  $('#player').innerHTML = `<div class="ov-in"><div class="stage done">
    <div class="medal-ic">${svg('medal',40,1.8)}</div>
    <h2 class="exname">${partial?'Séance enregistrée':'Séance terminée !'}</h2>
    <p class="cue">${esc(P.sess.name)} · ${esc(P.type.name)}</p>
    <div class="stats3"><div><b class="num">${fmt(dur)}</b><span>durée</span></div><div><b class="num">${sets}</b><span>séries</span></div><div><b class="num">${vol?nf(vol):'—'}</b><span>kg soulevés</span></div></div>
    ${recs.length ? `<p class="tag acc">Nouveau record : ${recs.map(esc).join(', ')}</p>` : ''}
    ${newMedals.length ? `<div class="card" style="width:100%"><h3>Médaille${newMedals.length>1?'s':''} obtenue${newMedals.length>1?'s':''}</h3><div class="medals">${newMedals.map(a => medalHTML(a, after)).join('')}</div></div>` : ''}
    <button class="btn wide" id="dClose" style="max-width:320px">Retour</button></div></div>`;
  loadBadges($('#player'));
  $('#dClose').onclick = closePlayer;
}

/* ---------- Médailles (lib/state/awards_state.dart) ---------- */
const GOALS = { firstStep:1, firstWorkout:1, firstRoutine:1, firstRecord:1, streak3:3, streak7:7, streak30:30, streak100:100, workouts10:10, workouts50:50, workouts100:100, workouts365:365, tonne1:1000, tonnes10:10000, tonnes100:100000, sets100:100, sets1000:1000, hours10:10, hours50:50, hours100:100 };
const awardGoal = id => GOALS[id];
function awardValue(id, s){
  if (id === 'firstStep') return 1;
  if (id === 'firstRoutine') return s.prog;
  if (id === 'firstRecord') return s.records;
  if (id.startsWith('streak')) return s.streak;
  if (id === 'firstWorkout' || id.startsWith('workouts')) return s.sessions;
  if (id.startsWith('tonne')) return Math.round(s.vol);
  if (id.startsWith('sets')) return s.sets;
  return Math.floor(s.hours);
}
function medalHTML(a, s){
  const v = awardValue(a.id, s), g = awardGoal(a.id), won = v >= g;
  return `<button class="medal ${won?'':'off'}" data-medal="${a.id}"><span class="img"><img data-badge="${a.id}${won?'':'_off'}" alt=""></span><span class="nm">${esc(a.name)}</span>${won?'':`<span class="pg"><i style="width:${Math.min(100, v/g*100)}%"></i></span>`}</button>`;
}
function loadBadges(root){ root.querySelectorAll('img[data-badge]').forEach(async img => { img.src = await badgeImg(img.dataset.badge); }); }

  const ivIdle = () => { const v = ivVals(); $('#ivTxt').textContent = 'Prêt · ' + fmt(v.w*v.n + v.r*(v.n-1)) + ' au total'; $('#ivSub').textContent = 'Appuie sur Lancer'; };
  ['ivW','ivR','ivN'].forEach(id => $('#'+id).oninput = () => { if (!iv.run) ivIdle(); }); ivIdle();
  $('#view').querySelectorAll('[data-iv]').forEach(b => b.onclick = () => { const [w,r,n] = b.dataset.iv.split(','); $('#ivW').value=w; $('#ivR').value=r; $('#ivN').value=n; if (!iv.run) ivIdle(); });
  $('#ivGo').onclick = () => { if (iv.run) return; const v = ivVals(); Object.assign(iv, { run:true, round:1, phase:'work', end:Date.now()+v.w*1000, last:null }); beep(990,.2);
    const loop = () => { if (!iv.run) return; const left = (iv.end - Date.now())/1000, w = Math.ceil(left);
      if (w<=3 && w>0 && iv.last!==w){ iv.last=w; beep(520,.1); }
      if (left <= 0){ iv.last = null;
        if (iv.phase === 'work' && iv.round < v.n && v.r > 0){ iv.phase='rest'; iv.end=Date.now()+v.r*1000; beep(660,.3); buzz(100); }
        else if (iv.round < v.n){ iv.round++; iv.phase='work'; iv.end=Date.now()+v.w*1000; beep(990,.25); buzz(150); }
        else { iv.run=false; beep(784,.15); setTimeout(()=>beep(1046,.35),160); buzz([100,50,200]); $('#ivTxt').textContent='Terminé !'; $('#ivSub').textContent=v.n+' tours bouclés'; return; } }
      $('#ivTxt').textContent = (iv.phase==='work'?'Effort ':'Repos ') + fmt(Math.ceil((iv.end-Date.now())/1000)); $('#ivSub').textContent = 'Tour ' + iv.round + ' / ' + v.n;
      iv.raf = requestAnimationFrame(loop); };
    iv.raf = requestAnimationFrame(loop); };
  $('#ivStop').onclick = () => { iv.run=false; cancelAnimationFrame(iv.raf); ivIdle(); };

  /* 1RM : poids × (1 + reps / 30) */
  on(['rmKg','rmR'], () => { const kg = val('rmKg'), r = Math.min(20, Math.max(1, Math.round(val('rmR'))||1)), one = r1(kg*(1+r/30));
    $('#rmOut').innerHTML = `<div class="main num">${nf(one,1)} kg</div><table class="num">${[95,90,85,80,75,70,65,60,50].map(p=>`<tr><td>${p} %</td><td>${nf(roundTo(one*p/100,2.5),1)} kg</td></tr>`).join('')}</table>`; });
  /* RPE */
  on(['rpW','rpR','rpE','rpTR','rpTE'], () => { const one = r1(val('rpW') / rpePct(Math.round(val('rpR')), val('rpE'))), res = roundTo(one * rpePct(Math.round(val('rpTR')), val('rpTE')), 2.5);
    $('#rpOut').innerHTML = `<div class="main num">${nf(res,1)} kg</div><div class="hint num">Pour ${Math.round(val('rpTR'))} reps à RPE ${nf(val('rpTE'),1)}. 1RM estimé : ${nf(one,1)} kg.</div>`; });
  /* Échauffement : 40 % × 10, 60 % × 5, 80 % × 3, 90 % × 1 */
  on(['wuKg'], () => { const t = val('wuKg'); $('#wuOut').innerHTML = `<table class="num">${[[40,10],[60,5],[80,3],[90,1]].map(([p,r])=>`<tr><td>${p} % · ${r} rep${r>1?'s':''}</td><td>${nf(roundTo(t*p/100,2.5),1)} kg</td></tr>`).join('')}<tr><td>Charge de travail</td><td>${nf(t,1)} kg</td></tr></table>`; });
  /* Disques */
  const PL = [[25,'#C0392B',64],[20,'#3268A0',60],[15,'#C9A227',54],[10,'#3D7A52',48],[5,'#6B6B6B',38],[2.5,'#8A6B41',30],[1.25,'#9A9A9A',24]];
  const pl = () => { const t = val('plT'), b = +$('#plB').value; let side = Math.max(0, (t-b)/2);
    if (t < b){ $('#plOut').innerHTML = `<div class="hint">La charge visée est plus légère que la barre (${b} kg).</div>`; return; }
    const used = []; PL.forEach(([w,c,h]) => { while (side >= w - 1e-6){ used.push([w,c,h]); side = Math.round((side - w)*100)/100; } });
    const real = b + used.reduce((a,[w])=>a+w,0)*2;
    $('#plOut').innerHTML = `<div class="main num">${used.length ? used.map(u=>nf(u[0],2)).join(' + ') : 'Barre seule'}</div>
      <div class="plates" aria-hidden="true">${b?'<span class="bar"></span>':''}${used.map(([w,c,h])=>`<span class="plate" style="height:${h}px;width:${w>=10?16:12}px;background:${c}">${nf(w,2)}</span>`).join('')}</div>
      <div class="hint num">Par côté. Total chargé : ${nf(real,2)} kg${Math.abs(real-t)>.01?` (au plus proche de ${nf(t,2)} kg)`:''}.</div>`; };
  $('#plB').onchange = pl; on(['plT'], pl);
  /* IMC */
  on(['bmH','bmW'], () => { const v = r1(val('bmW') / Math.pow(val('bmH')/100, 2)), cat = v < 18.5 ? 'Insuffisance pondérale' : v < 25 ? 'Corpulence normale' : v < 30 ? 'Surpoids' : 'Obésité';
    $('#bmOut').innerHTML = `<div class="main num">${nf(v,1)}</div><div class="hint">${cat}</div>`; });
  /* Calories : Mifflin-St Jeor, macros 30/40/30 */
  const cal = () => { const m = segVal('caS') === 'm', bmr = 10*val('caW') + 6.25*val('caH') - 5*val('caA') + (m ? 5 : -161), tdee = Math.round(bmr * parseFloat(segVal('caL')));
    $('#caOut').innerHTML = `<div class="main num">${nf(tdee)} kcal par jour</div><table class="num"><tr><td>Protéines (30 %)</td><td>${Math.round(tdee*.3/4)} g</td></tr><tr><td>Glucides (40 %)</td><td>${Math.round(tdee*.4/4)} g</td></tr><tr><td>Lipides (30 %)</td><td>${Math.round(tdee*.3/9)} g</td></tr></table>`; };
  segBind('caS', cal); segBind('caL', cal); on(['caA','caH','caW'], cal);
  /* Masse grasse US Navy */
  const lg = Math.log10;
  const bf = () => { const m = segVal('bfS') === 'm'; $('#bfHipF').hidden = m;
    const v = m ? 495 / (1.0324 - .19077*lg(Math.max(1, val('bfW')-val('bfN'))) + .15456*lg(val('bfH'))) - 450
                : 495 / (1.29579 - .35004*lg(Math.max(1, val('bfW')+val('bfHp')-val('bfN'))) + .221*lg(val('bfH'))) - 450;
    $('#bfOut').innerHTML = `<div class="main num">${nf(r1(Math.max(3, Math.min(50, v))),1)} %</div>`; };
  segBind('bfS', bf); on(['bfH','bfN','bfW','bfHp'], bf);
  /* FFMI */
  const ff = () => { const mH = val('ffH')/100, lean = val('ffW')*(1-val('ffB')/100), s = r1(lean/(mH*mH) + 6.1*(1.8-mH)), adj = s + (segVal('ffS') === 'm' ? 0 : 3);
    const lvl = adj < 18 ? 0 : adj < 20 ? 1 : adj < 22 ? 2 : adj < 25 ? 3 : 4;
    $('#ffOut').innerHTML = `<div class="main num">${nf(s,1)}</div><div class="hint num">${['Sous la moyenne','Dans la moyenne','Au-dessus de la moyenne','Excellent','Exceptionnel'][lvl]} · masse maigre ${nf(r1(lean),1)} kg</div>`; };
  segBind('ffS', ff); on(['ffH','ffW','ffB'], ff);
  /* DOTS et Wilks */
  const dots = () => { const m = segVal('doS') === 'm', total = val('doSq') + val('doBe') + val('doDl');
    let bw = Math.min(m ? 210 : 150, Math.max(40, val('doBW')));
    const c = m ? [-307.75076,24.0900756,-0.1918759221,0.0007391293,-0.000001093] : [-57.96288,13.6175032,-0.1126655495,0.0005158568,-0.0000010706];
    const d = r1(total*500/(c[0]+c[1]*bw+c[2]*bw*bw+c[3]*bw**3+c[4]*bw**4));
    bw = Math.min(m ? 201.9 : 154.53, Math.max(m ? 40 : 26.51, val('doBW')));
    const w = m ? [-216.0475144,16.2606339,-0.002388645,-0.00113732,7.01863e-6,-1.291e-8] : [594.31747775582,-27.23842536447,0.82112226871,-0.00930733913,4.731582e-5,-9.054e-8];
    const wk = r1(total*500/w.reduce((a,k,i)=>a+k*bw**i,0));
    $('#doOut').innerHTML = `<table class="num"><tr><td>Total</td><td>${nf(total,1)} kg</td></tr><tr><td>DOTS</td><td>${nf(d,1)} · ${LEVEL[strengthLevel(d)]}</td></tr><tr><td>Wilks</td><td>${nf(wk,1)} · ${LEVEL[strengthLevel(wk)]}</td></tr></table>`; };
  segBind('doS', dots); on(['doBW','doSq','doBe','doDl'], dots);
  /* Zones FC */
  on(['hrA','hrR'], () => { const a = val('hrA')||30, r = val('hrR')||60, max = 220-a, res = max-r;
    $('#hrOut').innerHTML = `<div class="main num">FC max ≈ ${max} bpm</div><table class="num">${[['Z1 · Récupération',50,60],['Z2 · Endurance',60,70],['Z3 · Tempo',70,80],['Z4 · Seuil',80,90],['Z5 · VMA',90,100]].map(([n,lo,hi])=>`<tr><td>${n}</td><td>${Math.round(r+res*lo/100)}–${Math.round(r+res*hi/100)} bpm</td></tr>`).join('')}</table>`; });

  /* Aliments (assets/data/foods.tsv) */
  const foodIO = 'IntersectionObserver' in window ? new IntersectionObserver(ents => ents.forEach(async en => { if (en.isIntersecting){ foodIO.unobserve(en.target); en.target.src = await foodImg(en.target.dataset.food); } }), { rootMargin:'300px' }) : null;
  const drawFoods = () => {
    const q = norm(state.foodQ).split(' ').filter(Boolean);
    const list = D.foods.filter(f => (!state.foodCat || f.cat === state.foodCat) && q.every(w => norm(f.fr + ' ' + f.en).includes(w))).sort((a,b) => a.fr.localeCompare(b.fr,'fr'));
    $('#foods').innerHTML = list.length ? list.slice(0, state.foodN).map(f => `<div class="food"><span class="ph">${f.img?`<img data-food="${f.img}" alt="">`:svg('food',22)}</span>
      <div class="grow"><div class="t">${esc(f.fr)}</div><div class="macros num"><span>P <b>${nf(f.p,1)}</b></span><span>G <b>${nf(f.c,1)}</b></span><span>L <b>${nf(f.f,1)}</b></span>${f.fi?`<span>Fibres <b>${nf(f.fi,1)}</b></span>`:''}</div>
      ${f.g && f.kind ? `<div class="hint num">1 ${UNIT[f.kind]||f.kind} ≈ ${nf(f.g)} g, soit ${nf(f.k*f.g/100)} kcal</div>` : ''}</div>
      <div class="kcal num">${nf(f.k)}<small>kcal / 100 g</small></div></div>`).join('') : `<div class="empty">Aucun aliment ne correspond.</div>`;
    $('#fMore').hidden = list.length <= state.foodN;
    $('#foods').querySelectorAll('img[data-food]').forEach(img => foodIO ? foodIO.observe(img) : foodImg(img.dataset.food).then(s => img.src = s));
  };
  $('#fq').oninput = e => { state.foodQ = e.target.value; state.foodN = 30; drawFoods(); };
  $('#view').querySelectorAll('[data-fc]').forEach(b => b.onclick = () => { state.foodCat = b.dataset.fc; state.foodN = 30; $('#view').querySelectorAll('[data-fc]').forEach(x => x.setAttribute('aria-pressed', String(x===b))); drawFoods(); });
  $('#fMore').onclick = () => { state.foodN += 30; drawFoods(); };
  drawFoods();
}

/* ---------- Vue Profil ---------- */
function sampleHistory(){
  const d = n => Date.now() - n*86400000;
  return [ { date:d(1), type:'gainage', sess:'Gainage profond découverte', dur:1180, sets:17, vol:0 },
           { date:d(2), type:'programmes', sess:'Full Body · Lun', dur:3480, sets:18, vol:7420 },
           { date:d(4), type:'cardio', sess:'Fractionné 30/30', dur:1690, sets:12, vol:0 } ];
}
function viewProfil(){
  const real = history.length > 0, items = real ? history : sampleHistory(), st = stats();
  const counts = new Map(); items.forEach(h => { const k = dayKey(h.date); counts.set(k, (counts.get(k)||0)+1); });
  const days = [...Array(28)].map((_,i) => { const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate()-27+i); return counts.get(dayKey(x))||0; });
  const total = items.reduce((a,h)=>a+h.dur,0), vol = items.reduce((a,h)=>a+(h.vol||0),0);
  const won = D.awards.filter(a => awardValue(a.id, st) >= awardGoal(a.id)).length;
  const trained = {}; history.slice(0, 30).forEach(h => (h.ex||[]).forEach(x => { const e = EX[x.id]; if (!e || !MUSCLE[e.p]) return; trained[e.p] = (trained[e.p]||0) + 1; e.s.forEach(m => trained[m] = (trained[m]||0) + .5); }));
  const maxT = Math.max(1, ...Object.values(trained));
  $('#view').innerHTML = `
  <section class="section"><div class="today">
    <div><div class="k num">${items.length}</div><div class="l">séances${real?'':' <span class="sample">Exemple</span>'}</div></div>
    <div><div class="k num">${nf(total/3600,1)}</div><div class="l">heures</div></div>
    <div><div class="k num">${vol>=1000?nf(vol/1000,1)+' t':nf(vol)+' kg'}</div><div class="l">soulevés</div></div></div></section>
  <section class="section"><div class="section-head"><h2>Médailles</h2><span class="eyebrow num">${won} sur ${D.awards.length}</span></div>
    <div class="card"><div class="medals">${D.awards.map(a => medalHTML(a, st)).join('')}</div><p class="hint" id="medalLine">Touche une médaille pour voir comment l'obtenir.</p></div></section>
  ${Object.keys(trained).length ? `<section class="section"><div class="section-head"><h2>Muscles travaillés</h2><span class="eyebrow">30 dernières séances</span></div><div class="mini">${bodyHTML({ cls:m => !trained[m] ? '' : trained[m]/maxT > .5 ? 'pri' : 'sec', label:'Muscles travaillés récemment' })}</div></section>` : ''}
  <section class="section"><div class="section-head"><h2>4 dernières semaines</h2>${real?'':'<span class="sample">Exemple</span>'}</div>
    <div class="heat" aria-label="Activité des 28 derniers jours">${days.map(v=>`<i class="${v?'l'+Math.min(3,v+1):''}"></i>`).join('')}</div></section>
  <section class="section"><div class="section-head"><h2>Historique</h2>${real?`<button class="link" id="hClear">Tout effacer</button>`:''}</div>
    ${real?'':`<div class="empty">Les séances que tu termines s'affichent ici. En attendant, voici à quoi ça ressemble.<button class="btn" id="hGo">Choisir une séance</button></div>`}
    <div class="hist">${items.slice(0, 50).map(h => { const t = typeById(h.type) || PERSO;
      return `<div class="hitem" style="--tint:${t.tint}"><span class="tint-ic">${svg(t.id,20,2.2)}</span>
        <div class="grow"><div class="t">${esc(h.sess)}${real?'':'<span class="sample">Exemple</span>'}</div>
        <div class="meta num"><span>${new Date(h.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</span><span>${fmt(h.dur)}</span><span>${h.sets} séries</span>${h.vol?`<span>${nf(h.vol)} kg</span>`:''}${h.partial?'<span>incomplète</span>':''}</div></div></div>`; }).join('')}</div>
    <div id="hConfirm"></div></section>
  <section class="section"><div class="section-head"><h2>L'appli GymMane</h2></div>${featuresHTML()}</section>`;
  loadBadges($('#view'));
  $('#view').querySelectorAll('[data-medal]').forEach(b => b.onclick = () => { const a = D.awards.find(x => x.id === b.dataset.medal), v = awardValue(a.id, st), g = awardGoal(a.id);
    $('#medalLine').innerHTML = `<b>${esc(a.name)}</b> · ${esc(a.line)} <span class="num">(${nf(Math.min(v,g))} / ${nf(g)})</span>${a.id==='firstRoutine'?' Ici : termine une séance d\'un programme GymMane.':''}`; });
  if ($('#hGo')) $('#hGo').onclick = () => go('seances');
  if ($('#hClear')) $('#hClear').onclick = () => {
    $('#hConfirm').innerHTML = `<div class="empty">Effacer les ${history.length} séances de cet appareil ?<div class="row" style="width:100%"><button class="btn ghost" id="hNo">Garder</button><button class="btn" id="hYes" style="background:var(--danger);color:#fff">Effacer</button></div></div>`;
    $('#hNo').onclick = () => $('#hConfirm').innerHTML = '';
    $('#hYes').onclick = () => { history = []; store.set('history', history); toast('Historique effacé'); viewProfil(); };
    $('#hConfirm').scrollIntoView({block:'nearest'}); };
}
function featuresHTML(){
  const F = [
    ['Entraînement', ['<b>Carte du corps</b> : touche les muscles à travailler et obtiens une séance','Répétitions, charge et <b>minuteur de repos</b> avec ton propre son','Séries d\'échauffement, dégressives, à l\'échec, rest-pause et cluster, avec RPE ou RIR','<b>Supersets</b> et calcul des <b>disques par côté</b>','<b>Routines</b>, plannings hebdo et rotations, jours off qui gardent ta série','<b>Progression</b> par exercice, semaines de décharge et séances légères','Une <b>voix</b> qui guide ton repos <span class="pill">bêta</span>']],
    ['Progrès', ['Volume, séries de jours, objectif hebdo et <b>records</b> pour chaque plage de reps','<b>Courbes de force</b> avec 1RM estimé et force par kg de poids de corps','<b>Carte d\'activité</b> et carte des muscles travaillés','<b>Ton mois en résumé</b>, en story et en carte à partager','<b>Photos de progression</b> sur une frise','Poids, <b>dix mensurations</b>, pas, sommeil et fréquence cardiaque','Niveaux, <b>médailles</b> et un sticker pour partager ta séance']],
    ['Exercices et outils', [`<b>${D.exercises.length} exercices</b> avec animations et consignes`,'Recherche par muscle, matériel ou niveau, ou ajoute <b>les tiens</b>','Ta propre <b>photo, GIF ou vidéo</b> pour n\'importe quel exercice','<b>Lieux</b> : indique ton matériel, l\'appli ne propose que ce qui est possible','Un <b>journal d\'entraînement</b> avec photos et vidéos','Dix <b>calculateurs</b> et cinq <b>widgets</b>']],
    ['Nutrition <span class="pill">bêta</span>', [`Calories et macros face à ton objectif, <b>${D.foods.length} aliments</b> en photo`,'Tes aliments et plats, eau, compléments avec dose et stock','Plans de repas et meal prep','Demande un repas à une IA, colle sa réponse, GymMane la transforme en vrais aliments']],
    ['Tes données', ['Export <b>CSV</b> et sauvegarde <b>ZIP</b> complète','Import depuis <b>Hevy, Strong, Lyfta, FitNotes</b> ou openGym','<b>Health Connect</b> et export vers <b>Strava</b> en fichier .fit','Pas de compte, pas de pub, pas de suivi, <b>pas d\'accès internet</b>','18 langues, thème clair ou sombre, kg ou lb']]
  ];
  return `<div class="card" style="background:var(--ember);color:var(--on-ember)"><h3 style="font-size:20px">Soulève. Note. Progresse.</h3>
    <p style="opacity:.8">GymMane est un carnet d'entraînement gratuit, hors ligne et open source pour Android. Cette page reprend ses exercices, programmes, outils et médailles pour les avoir sous la main pendant l'effort.</p></div>
    ${F.map(([h, items]) => `<div class="card feat"><h3 style="font-size:16px">${h}</h3><ul>${items.map(i=>`<li><span>${i}</span></li>`).join('')}</ul></div>`).join('')}
    <div class="card"><h3 style="font-size:16px">Télécharger l'appli</h3><p class="hint">Android 7.0 et plus. Disponible sur F-Droid, IzzyOnDroid, OpenAPK, Obtainium et GitHub.</p>
      <a class="btn wide" href="https://github.com/InlitX/GymMane/releases/latest" target="_blank" rel="noopener">Voir la dernière version</a></div>
    <div class="card"><h3 style="font-size:16px">Crédits</h3><p class="hint">Basé sur GymMane par InlitX (code sous licence GPL-3.0). Dessins d'exercices : Workout Guide de Bryl Lim, d'après Everkinetic, sous licence CC BY-SA 4.0. Médailles, silhouettes et photos d'aliments : dépôt GymMane. Police Nunito sous licence SIL Open Font License.</p></div>`;
}

/* ---------- Démarrage ---------- */
renderSound();
route();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && P) lockScreen(); });
})();
